["Ralph Loop"]
etymology = "https://ghuntley.com/loop/"
extended_def = "The reason this was created is because AI agents have a finite context, and when a single one is assigned a long-horizon task, often its context is compacted after some time, and important details are lost. Using a Ralph Loop forces you (or your AI agent) to split-up your work into bite-sized chunks and send agents one-by-one to iterate on it"

["Ralph Loop".definition]
noun = ["A software loop that activates an AI coding agent from the command-line to accomplish a long-horizon task one small step at a time."]


["Declarative"]
